name: CI and deploy dev

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_all:
        description: Deploy infrastructure and API regardless of changed paths
        type: boolean
        default: false

permissions:
  contents: read

env:
  BICEP_CLI_VERSION: v0.48.1

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test API and deployment selection
        run: python -m unittest discover -s tests -v

      - name: Compile and lint Bicep
        shell: pwsh
        run: |
          az bicep install --version $env:BICEP_CLI_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Bicep CLI installation failed.' }
          az bicep build --file infrastructure/main.bicep --stdout > $null
          if ($LASTEXITCODE -ne 0) { throw 'Bicep compilation failed.' }
          foreach ($parameterFile in @('dev', 'prod')) {
            az bicep build-params --file "infrastructure/parameters/$parameterFile.bicepparam" --stdout > $null
            if ($LASTEXITCODE -ne 0) { throw "Parameter compilation failed: $parameterFile" }
          }

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem scripts -Filter '*.ps1') {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }

  deploy:
    name: Deploy dev
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: dev
      url: ${{ steps.target.outputs.url }}
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-reserving-dev' }}
      INFRA_DEPLOYMENT_NAME: ${{ vars.INFRA_DEPLOYMENT_NAME || 'reserving-dev-infrastructure' }}
    steps:
      - name: Check out release source and history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # Compare with the last successful release, including changes from failed runs.
      # Planning happens inside the deployment lock so the baseline stays consistent.
      - name: Select deployment steps
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_all || false }}
        run: python scripts/get-deployment-plan.py

      - name: Report validation-only change
        if: steps.plan.outputs.infra != 'true' && steps.plan.outputs.api != 'true'
        shell: pwsh
        run: |
          'No development infrastructure or API deployment inputs changed.' >> $env:GITHUB_STEP_SUMMARY

      - name: Check Azure configuration
        if: steps.plan.outputs.infra == 'true' || steps.plan.outputs.api == 'true'
        shell: pwsh
        run: |
          foreach ($variableName in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($variableName))) {
              throw "Set $variableName in the GitHub dev environment. See .github/README.md."
            }
          }

      - name: Sign in to Azure using OIDC
        if: steps.plan.outputs.infra == 'true' || steps.plan.outputs.api == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Apply infrastructure when needed and resolve app target
        id: target
        if: steps.plan.outputs.infra == 'true' || steps.plan.outputs.api == 'true'
        shell: pwsh
        env:
          INFRA_CHANGED: ${{ steps.plan.outputs.infra }}
          API_CHANGED: ${{ steps.plan.outputs.api }}
        run: |
          $applyInfrastructure = $env:INFRA_CHANGED -eq 'true'
          $outputs = $null

          if (-not $applyInfrastructure) {
            # API-only releases read the same deployment's persisted outputs.
            $storedOutputs = az deployment group show --resource-group $env:AZURE_RESOURCE_GROUP --name $env:INFRA_DEPLOYMENT_NAME --query properties.outputs --output json --only-show-errors
            if ($LASTEXITCODE -eq 0) {
              $outputs = ($storedOutputs -join [Environment]::NewLine) | ConvertFrom-Json
            }
            if (-not $outputs.appServiceName.value -or -not $outputs.appServiceUrl.value) {
              Write-Host 'Infrastructure outputs are missing; applying Bicep before deploying the API.'
              $applyInfrastructure = $true
            }
          }

          if ($applyInfrastructure) {
            az bicep install --version $env:BICEP_CLI_VERSION
            if ($LASTEXITCODE -ne 0) { throw 'Bicep CLI installation failed.' }
            $deployedOutputs = az deployment group create --resource-group $env:AZURE_RESOURCE_GROUP --name $env:INFRA_DEPLOYMENT_NAME --parameters infrastructure/parameters/dev.bicepparam --query properties.outputs --output json --only-show-errors
            if ($LASTEXITCODE -ne 0) { throw 'Infrastructure deployment failed; API deployment will not run.' }
            $outputs = ($deployedOutputs -join [Environment]::NewLine) | ConvertFrom-Json
          }

          $appName = [string]$outputs.appServiceName.value
          if ([string]::IsNullOrWhiteSpace($appName)) { throw 'Infrastructure returned no appServiceName output.' }
          $hostname = az webapp show --resource-group $env:AZURE_RESOURCE_GROUP --name $appName --query defaultHostName --output tsv --only-show-errors
          if ($LASTEXITCODE -ne 0 -or -not $hostname) { throw 'The web app target could not be resolved.' }

          "app_name=$appName" >> $env:GITHUB_OUTPUT
          "url=https://$hostname" >> $env:GITHUB_OUTPUT
          $deployApi = ($env:API_CHANGED -eq 'true' -or $applyInfrastructure).ToString().ToLowerInvariant()
          "deploy_api=$deployApi" >> $env:GITHUB_OUTPUT
          "Deployment target: [$appName](https://$hostname)" >> $env:GITHUB_STEP_SUMMARY

      - name: Deploy API source
        if: steps.target.outputs.deploy_api == 'true'
        shell: pwsh
        env:
          APP_NAME: ${{ steps.target.outputs.app_name }}
        run: ./scripts/deploy-api.ps1 -ResourceGroupName $env:AZURE_RESOURCE_GROUP -AppName $env:APP_NAME

      - name: Verify deployed API
        if: steps.target.outputs.url != ''
        shell: pwsh
        env:
          APP_URL: ${{ steps.target.outputs.url }}
        run: |
          $deadline = [DateTime]::UtcNow.AddMinutes(3)
          $healthy = $false
          do {
            try {
              $health = Invoke-RestMethod -Uri "$env:APP_URL/health" -TimeoutSec 10
              $greeting = Invoke-RestMethod -Uri "$env:APP_URL/hello?name=GitHub" -TimeoutSec 10
              if ($health.status -ne 'ok' -or $greeting.message -ne 'Hello, GitHub!') {
                throw 'The API returned an unexpected response.'
              }
              $healthy = $true
              break
            }
            catch {
              Write-Host 'Waiting for the deployed API to start...'
              Start-Sleep -Seconds 5
            }
          } while ([DateTime]::UtcNow -lt $deadline)
          if (-not $healthy) { throw 'Deployed API failed its health and greeting checks.' }
          'API health and greeting checks passed.' >> $env:GITHUB_STEP_SUMMARY
